name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (tests/run.sh fails in CI when a check is skipped)
        run: python3 -m pip install pyyaml==6.0.2
      - name: Install shellcheck (tests/run.sh fails in CI when its check is skipped)
        run: python3 -m pip install shellcheck-py==0.10.0.1
      - name: Fixtures, hook and repository checks
        run: bash tests/run.sh
      - name: Trial harness self-test
        run: bash tests/trials/selftest.sh
      - name: Trial harness tests
        # test-codex-isolation.sh and test-codex-invocation.sh need a logged-in Codex, and test-linux-boundary.sh needs Docker with
        # the locally built todo-codex-linux image; they are run by hand
        run: |
          for t in tests/trials/test-*.sh; do
            case "$t" in *test-codex-isolation.sh|*test-codex-invocation.sh|*test-linux-boundary.sh|*test-windows-verifier-isolation.sh) continue ;; esac
            bash "$t" || exit 1
          done
