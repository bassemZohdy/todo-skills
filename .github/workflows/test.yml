name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fixtures, hook and repository checks
        run: bash tests/run.sh
      - name: Trial harness self-test
        run: bash tests/trials/selftest.sh
