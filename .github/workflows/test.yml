name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fixtures, hook and repository checks
        run: bash tests/run.sh
      - name: Trial harness self-test
        run: bash tests/trials/selftest.sh
      - name: Trial harness tests
        # test-codex-isolation.sh and test-codex-invocation.sh need a logged-in Codex; they are run by hand
        run: |
          for t in tests/trials/test-*.sh; do
            case "$t" in *test-codex-isolation.sh|*test-codex-invocation.sh) continue ;; esac
            bash "$t" || exit 1
          done
